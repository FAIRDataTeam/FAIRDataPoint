# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "maven"
    # Where to look for the pom.xml
    directory: "/"
    # How often to check the registry for updates
    schedule:
      interval: "daily"
    # Which labels to add to generated PRs
    labels:
      - "dependencies"
    # Spring-boot updates are always considered separately, regardless of semver level,because of the many transitive dependencies.
    # Other *major* updates are also considered separately because they often require closer scrutiny.
    # Non-major updates are grouped to reduce the number of PRs.
    # Note that group rules are applied in order, so the first match wins.
    groups:
      spring-boot:
        applies-to: version-updates
        patterns:
          - "*spring-boot-starter-parent*"
      major:
        applies-to: version-updates
        update-types:
          - "major"
        exclude-patterns:
          - "*spring-boot-starter-parent*"
      non-major:
        applies-to: version-updates
        exclude-patterns:
          - "*spring-boot-starter-parent*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    allow:
      # don't do major upgrades
      - dependency-name: "*eclipse-temurin*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
