instance:
  index: ${FDP_INDEX:false}
  indexAutoPermit: ${FDP_INDEX_AUTOPERMIT:true}
  clientUrl: ${FDP_CLIENT_URL:http://localhost:8080}
  persistentUrl: ${FDP_PERSISTENT_URL:http://localhost:8080}
  title: ${FDP_TITLE:FAIR Data Point}
  subtitle: ${FDP_SUBTITLE:Metadata for machines}

spring:
  data:
    web:
      pageable:
        default-page-size: 50
        qualifier-delimiter: _
  http:
    clients:
      # https://docs.spring.io/spring-boot/reference/io/rest-client.html#io.rest-client.global-configuration
      connect-timeout: 5s
      read-timeout: 5s
  mongodb:
    representation:
      uuid: standard
    uri: mongodb://${FDP_MONGO_HOST:mongo}:${FDP_MONGO_PORT:27017}/${FDP_MONGO_DB:fdp}
  profiles:
    active: production
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 5000
      thread-name-prefix: fdp-task-

management:
  info:
    defaults:
      enabled: false
  endpoints:
    web:
      exposure:
        # To expose custom http.server.requests http.url metric, include "metrics".
        # This can also be done using env variable MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE.
        # Note the ActuatorMetricsConfig ensures that only the http.server.requests meter is enabled.
        include: health, info

security:
  jwt:
    token:
      # Secret used to sign JWTs (HS256). REQUIRED: there is no default, the FDP refuses to start without it.
      # Use at least 32 random bytes, e.g. generated with `openssl rand -base64 48`, and keep it unique per
      # deployment. Changing it invalidates all issued tokens.
      secret-key: ${FDP_JWT_SECRET_KEY:}

# valid repository type options {1 = inMemoryStore, 2 = NativeStore, 3 = AllegroGraph, 4 = graphDB, 5 = blazegraph}
repository:
  type: ${FDP_TRIPLE_STORE_TYPE:1}
  native:
    dir: ${FDP_TRIPLE_STORE_DIR:/tmp/fdp-store/}
  agraph:
    url: ${FDP_TRIPLE_STORE_URL:http://localhost:10035/repositories/fdp}
    username: ${FDP_TRIPLE_STORE_USERNAME:user}
    password: ${FDP_TRIPLE_STORE_PASSWORD:password}
  graphDb:
    url: ${FDP_TRIPLE_STORE_URL:http://localhost:7200}
    repository: ${FDP_TRIPLE_STORE_REPOSITORY:test}
    username: ${FDP_TRIPLE_STORE_USERNAME:user}
    password: ${FDP_TRIPLE_STORE_PASSWORD:password}
  blazegraph:
    url: ${FDP_TRIPLE_STORE_URL:http://localhost:8888/blazegraph}
    repository: ${FDP_TRIPLE_STORE_REPOSITORY:test}

metadataProperties:
  language: ${FDP_METADATA_LANGUAGE:http://id.loc.gov/vocabulary/iso639-1/en}
  license: ${FDP_METADATA_LICENSE:http://purl.org/NET/rdflicense/cc-zero1.0}
  accessRightsDescription: ${FDP_METADATA_ACCESS_RIGHTS:This resource has no access restriction}

openapi:
  title: FAIR Data Point API
  version: "@project.version@"
  description: "The reference implementation of the metadata registration service: A service implementing the API specification. It contains an authentication system to allow maintainers to define and update metadata. Read-only access to the data is public."
  contact:
    name: Luiz Bonino
    email: l.o.boninodasilvasantos@utwente.nl
    url: https://github.com/FAIRDataTeam/FAIRDataPoint

springdoc:
  # https://springdoc.org/properties.html
  swagger-ui:
    disable-swagger-default-url: true
    doc-expansion: none
    operationsSorter: method
    tagsSorter: alpha
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

server:
  # The `native` strategy configures tomcat to handle `x-forwarded-*` headers so that `request.getRemoteAddr()` yields
  # the correct remote IP address. The web-facing trusted reverse proxy must discard any x-forwarded-for headers set by
  # the remote client, in order to prevent IP spoofing. For example, the reverse-proxy should use
  # `proxy_set_header X-Forwarded-For $remote_addr;` instead of `$proxy_add_x_forwarded_for`.
  # https://docs.spring.io/spring-boot/how-to/webserver.html#howto.webserver.use-behind-a-proxy-server
  forward-headers-strategy: native
